buildscript
{
	repositories
	{
		google()
		mavenCentral()
	}

	dependencies
	{
		classpath 'com.android.tools.build:gradle:4.1.3'
	}
}

apply plugin: 'com.android.application'

repositories
{
	google()
	mavenCentral()
}

android
{
	compileSdkVersion 29
	buildToolsVersion '29.0.3'

	defaultConfig
	{
		applicationId 'cafe.raytek.victor.latinime'
		minSdkVersion 18
		targetSdkVersion 29
		versionCode 1
		versionName '1.0'
		
		ndk
		{
			abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
		}
		
		externalNativeBuild
		{
			ndkBuild
			{
				arguments "NDK_APPLICATION_MK:=${file('native/jni/Application.mk').absolutePath}"
			}
		}
	}
	
	packagingOptions
	{
		doNotStrip '**/*.so'
	}

	sourceSets
	{
		main
		{
			manifest.srcFile 'java/AndroidManifest.xml'
			java.srcDirs = [
				'java/src',
				'external/inputmethod-common/java'
			]
			res.srcDirs = ['java/res']
			assets.srcDirs = ['java/assets']
			aidl.srcDirs = ['java/src']
			jni.srcDirs = []
			jniLibs.srcDirs = []
		}
	}
	
	externalNativeBuild
	{
		ndkBuild
		{
			path file('native/jni/Android.mk')
		}
	}
	
	aaptOptions
	{
		noCompress 'dict'
	}

	compileOptions
	{
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
}

dependencies
{
	implementation 'com.android.support:support-v13:28.0.0'
}